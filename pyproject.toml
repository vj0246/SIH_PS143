[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oilspill"
version = "0.1.0"
description = "Global SAR oil slick detection: analysis ready data layer"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
  "pandas>=2.0",
  "pyarrow>=14",
  "tifffile>=2023.7",
  "imagecodecs",
  "scikit-image>=0.21",
  "scipy>=1.10",
  "typer>=0.9",
  "rich>=13",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov"]

[project.scripts]
oilspill = "oilspill.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
